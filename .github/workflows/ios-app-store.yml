name: iOS App Store Build

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "App Store build number (must be higher than the last uploaded build)"
        required: true
        default: "15"
        type: string
      submit:
        description: "Upload the finished IPA to App Store Connect"
        required: true
        default: true
        type: boolean

jobs:
  build-and-submit:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      IOS_BUILD_NUMBER: ${{ inputs.build_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Configure Expo
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build signed IPA on the GitHub macOS runner
        run: npx eas-cli@latest build --platform ios --profile production --local --output "$RUNNER_TEMP/oosan-river.ipa" --non-interactive

      - name: Save IPA
        uses: actions/upload-artifact@v4
        with:
          name: oosan-river-ios-${{ inputs.build_number }}
          path: ${{ runner.temp }}/oosan-river.ipa

      - name: Upload to App Store Connect
        if: ${{ inputs.submit }}
        run: npx eas-cli@latest submit --platform ios --path "$RUNNER_TEMP/oosan-river.ipa" --profile production --non-interactive
