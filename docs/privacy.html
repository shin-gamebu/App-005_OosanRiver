    <title>プライバシーポリシー - オオサンショウウオ育成</title>
    <style>
      body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, "Noto Sans JP", sans-serif; line-height: 1.7; margin: 24px; color: #123; }
      .box { max-width: 860px; margin: 0 auto; }
      h1 { font-size: 20px; margin-bottom: 12px; }
      h2 { font-size: 16px; margin-top: 22px; }
    </style>

  <body>
    <div class="box">
      <h1>プライバシーポリシー</h1>
      <h2>1. 収集する情報</h2>
      <p>本アプリは、主に端末内に保存するゲーム進行情報（例: 体長・満腹度・ヌメリ等）を利用します。</p>
      <h2>2. 情報の利用目的</h2>
      <p>収集した情報は、本アプリの機能提供（ゲーム進行・状態管理・表示）およびサービス改善のために利用します。</p>
      <h2>3. 通知（通知許可）</h2>
      <p>満腹度・ヌメリが低下したタイミングでローカル通知を行うため、通知許可が必要になる場合があります。</p>
      <h2>4. 第三者提供</h2>
      <p>法令に基づく場合を除き、ユーザー情報を第三者へ提供しないものとします。</p>
      <h2>5. お問い合わせ</h2>
      <p>利用方法やプライバシーに関するお問い合わせは <a href="./contact.html">お問い合わせページ</a> からお願いします。</p>
    </div>
  </body>
